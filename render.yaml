databases:
  - name: cubingnow-db
    plan: 0.5c-1g
    diskSizeGB: 10
    storageAutoscalingEnabled: true
    region: frankfurt
    databaseName: cubingnow
    user: cubingnow
    ipAllowList: []

services:
  - type: web
    name: cubingnow-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run python manage.py migrate && uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    domains:
      - api.cubingnow.com
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cubingnow-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: api.cubingnow.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://cubingnow.com,https://www.cubingnow.com
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_PUSH_VAPID_SUBJECT
        value: mailto:contact@cubingnow.com

  - type: worker
    name: cubingnow-api-poller
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: until uv run python manage.py migrate --check; do sleep 5; done; uv run python manage.py run_wca_live_api_polling
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cubingnow-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: api.cubingnow.com
      - key: WCA_API_POLL_INTERVAL_SECONDS
        value: "60"
      - key: PUSH_RECORD_EVENT_SOURCE
        value: api_polling

  - type: worker
    name: cubingnow-subscription-worker
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: until uv run python manage.py migrate --check; do sleep 5; done; uv run python manage.py run_wca_live_subscriptions
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cubingnow-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: api.cubingnow.com
      - key: WCA_WEEKEND_TIME_ZONE
        value: Europe/Amsterdam
      - key: WCA_COMPETITION_LOOKBACK_DAYS
        value: "7"
      - key: WCA_ROUND_DISCOVERY_INTERVAL_SECONDS
        value: "900"
      - key: WCA_SUBSCRIPTION_CATCHUP_MINUTES
        value: "60"

  - type: worker
    name: cubingnow-notification-worker
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    maxShutdownDelaySeconds: 30
    buildCommand: uv sync --frozen --no-dev
    startCommand: until uv run python manage.py migrate --check; do sleep 5; done; uv run python manage.py run_notification_worker
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: cubingnow-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: cubingnow-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: api.cubingnow.com
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        fromService:
          type: web
          name: cubingnow-api
          envVarKey: WEB_PUSH_VAPID_PUBLIC_KEY
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        fromService:
          type: web
          name: cubingnow-api
          envVarKey: WEB_PUSH_VAPID_PRIVATE_KEY
      - key: WEB_PUSH_VAPID_SUBJECT
        value: mailto:contact@cubingnow.com

  - type: worker
    name: cubingnow-classification-worker
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    maxShutdownDelaySeconds: 30
    buildCommand: uv sync --frozen --no-dev
    startCommand: until uv run python manage.py migrate --check; do sleep 5; done; uv run python manage.py run_classification_worker --interval 1 --batch-size 20
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: cubingnow-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: cubingnow-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: api.cubingnow.com

  - type: worker
    name: cubingnow-cubingchina-worker
    runtime: python
    plan: starter
    region: frankfurt
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: until uv run python manage.py migrate --check; do sleep 5; done; uv run python manage.py run_cubingchina_websocket
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: cubingnow-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: cubingnow-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: api.cubingnow.com
      - key: CUBINGCHINA_BASE_URL
        value: https://cubing.com
      - key: CUBINGCHINA_WS_URL
        value: wss://cubing.com/ws
      - key: CUBINGCHINA_DISCOVERY_INTERVAL_SECONDS
        value: "900"
      - key: CUBINGCHINA_LOOKBACK_DAYS
        value: "1"
      - key: CUBINGCHINA_LOOKAHEAD_DAYS
        value: "7"
      - key: CUBINGCHINA_COMPLETION_GRACE_MINUTES
        value: "720"
      - key: CUBINGCHINA_MAX_CONNECTIONS
        value: "10"
      - key: CUBINGCHINA_RETRY_BASE_SECONDS
        value: "1"
      - key: CUBINGCHINA_RETRY_MAX_SECONDS
        value: "60"
      - key: CUBINGCHINA_KEEPALIVE_SECONDS
        value: "55"

  - type: cron
    name: cubingnow-wca-export-refresh
    runtime: python
    plan: starter
    region: frankfurt
    schedule: "0 16 * * 2"
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: until uv run python manage.py migrate --check; do sleep 5; done; uv run python manage.py refresh_wca_public_export
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: cubingnow-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: cubingnow-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: api.cubingnow.com

  - type: cron
    name: cubingnow-weekend-attendance-sync
    runtime: python
    plan: starter
    region: frankfurt
    schedule: "15 */6 * * *"
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: until uv run python manage.py migrate --check; do sleep 5; done; uv run python manage.py sync_weekend_attendance
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: cubingnow-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: cubingnow-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: api.cubingnow.com
      - key: ATTENDANCE_WINDOW_TIME_ZONE
        value: Europe/Amsterdam

  - type: web
    name: cubingnow-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    domains:
      - cubingnow.com
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.cubingnow.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
